apiVersion: v1
kind: Service
metadata:
  name: {{ include "omni-v2.fullname" . }}-grpc
  namespace: {{ include "omni-v2.namespace" . }}
  labels:
    {{- include "omni-v2.labels" . | nindent 4 }}
  {{- with .Values.service.main.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.main.type }}
  {{- with .Values.service.main.clusterIP }}
  clusterIP: {{ . | quote}}
  {{- end }}
  ports:
    - name: omni
      port: {{ .Values.service.main.omniPort }}
      targetPort: omni
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: siderolink
      port: {{ .Values.service.main.siderolinkApiPort }}
      targetPort: siderolink-api
      protocol: TCP
      appProtocol: kubernetes.io/h2c
  selector:
    {{- include "omni-v2.selectorLabels" . | nindent 4 }}
